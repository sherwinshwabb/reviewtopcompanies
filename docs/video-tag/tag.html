<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Top Provider Picks: 9:16 brand tag</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!--
  A persistent brand tag for 9:16 video. The stage is authored at 1080x1920
  CSS px and captured at 2x for 2160x3840.

  Same page contract as the card-maker render pages:
    window.SEEK(t)   draw the frame at t seconds (returns a promise)
    window.DURATION  clip length in seconds
    window.FPS       frame rate
    window.READY     true once fonts are loaded and the tag is measured
    window.INTRO_END time after which every frame is identical (until the out)

  Query params:
    pos=top|bottom      where the tag sits               (default top)
    inset=7             distance from that edge, percent (default 7 top, 20 bottom)
    align=center|left   horizontal anchor                (default center)
    theme=dark|light    navy capsule or cream capsule    (default dark)
    sub=...             second line                      (default TopProviderPicks.com)
    dur=60 fps=30       clip length and frame rate
    out=1               fade the tag out over the last half second
    export=1            transparent background, no preview loop
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  body { font-family: "Inter", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body.preview {
    background:
      radial-gradient(900px 700px at 30% 22%, #cdb79a 0%, rgba(205,183,154,0) 62%),
      linear-gradient(180deg, #8a7359 0%, #b59c7e 38%, #6d5a47 100%);
  }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

  .tag {
    --bg: rgba(9, 22, 37, 0.95);
    --edge: rgba(255, 255, 255, 0.17);
    --name: #ffffff;
    --sub: #9fd3d6;
    --bar: #ffffff;
    --bar-accent: #85b9ba;
    --shadow: 0 22px 60px rgba(5, 14, 25, 0.38), 0 2px 6px rgba(5, 14, 25, 0.22);
    position: absolute;
    display: flex;
    align-items: center;
    height: 148px;
    padding: 0 34px;
    border-radius: 34px;
    background: var(--bg);
    border: 1.5px solid var(--edge);
    box-shadow: var(--shadow);
    overflow: hidden;
    opacity: 0;
    will-change: transform, opacity;
  }
  .tag.light {
    --bg: rgba(250, 249, 244, 0.94);
    --edge: rgba(23, 50, 77, 0.1);
    --name: #17324d;
    --sub: #176b79;
    --bar: #17324d;
    --bar-accent: #176b79;
    --shadow: 0 22px 60px rgba(5, 14, 25, 0.26), 0 2px 6px rgba(5, 14, 25, 0.14);
  }
  .tag.center { left: 50%; }
  .tag.left { left: 65px; }

  .mark { flex: 0 0 80px; width: 80px; height: 80px; display: grid; place-items: center; }
  .mark svg { width: 74px; height: auto; display: block; overflow: visible; }
  .mark .bar { transform-box: fill-box; transform-origin: 50% 100%; }

  .text { flex: 0 0 auto; overflow: hidden; width: 0; }
  .inner { display: inline-block; padding: 0 12px 0 26px; white-space: nowrap; }
  .name {
    font-size: 34px;
    line-height: 1;
    letter-spacing: 4.6px;
    font-weight: 500;
    color: var(--name);
  }
  .name b { font-weight: 700; }
  .sub {
    margin-top: 15px;
    font-size: 28px;
    line-height: 1;
    letter-spacing: 0.4px;
    font-weight: 400;
    color: var(--sub);
  }
  .sheen {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 220px;
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.16) 50%, rgba(255,255,255,0) 100%);
    opacity: 0;
    pointer-events: none;
  }
  .tag.light .sheen {
    background: linear-gradient(100deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.75) 50%, rgba(255,255,255,0) 100%);
  }
</style>
</head>
<body>
<div class="stage">
  <div class="tag" id="tag">
    <div class="mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 36 41" fill="none" aria-hidden="true">
        <path class="bar" id="bar1" d="M4 33V13l9-5v25z" fill="var(--bar)" opacity=".5" />
        <path class="bar" id="bar2" d="M15 33V8l9-5v30z" fill="var(--bar)" />
        <path class="bar" id="bar3" d="M26 33V15l9-5v23z" fill="var(--bar-accent)" />
        <path id="base" d="m5 39 15-3 15 3" stroke="var(--bar)" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
      </svg>
    </div>
    <div class="text" id="text">
      <div class="inner" id="inner">
        <div class="name">TOP <b>PROVIDER PICKS</b></div>
        <div class="sub" id="sub">TopProviderPicks.com</div>
      </div>
    </div>
    <div class="sheen" id="sheen"></div>
  </div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const pos = q.get("pos") === "bottom" ? "bottom" : "top";
  const align = q.get("align") === "left" ? "left" : "center";
  const theme = q.get("theme") === "light" ? "light" : "dark";
  const inset = Number(q.get("inset") ?? (pos === "top" ? 7 : 20));
  const exporting = q.get("export") === "1";
  const withOut = q.get("out") === "1";
  const DURATION = Math.max(3, Number(q.get("dur") ?? 60));
  const FPS = Number(q.get("fps") ?? 30);
  const OUT = 0.5;
  const INTRO_END = 2.5;

  const $ = (id) => document.getElementById(id);
  const tag = $("tag"), text = $("text"), inner = $("inner"), sheen = $("sheen");
  const bars = [$("bar1"), $("bar2"), $("bar3")], base = $("base");
  if (q.get("sub") !== null) $("sub").textContent = q.get("sub");
  if ($("sub").textContent.trim() === "") $("sub").style.display = "none";
  tag.classList.add(theme, align);
  tag.style[pos] = inset + "%";
  if (!exporting) document.body.classList.add("preview");

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (p) => 1 - Math.pow(1 - p, 3);
  const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
  const outBack = (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2);

  let textWidth = 0;
  const drift = pos === "top" ? -22 : 22;

  function draw(t) {
    // 1. the capsule lands as a square holding only the mark
    const land = outCubic(span(t, 0.2, 0.6));
    // 2. the three bars rise, then the base line draws
    bars.forEach((b, i) => {
      const p = span(t, 0.34 + i * 0.09, 0.74 + i * 0.09);
      b.style.transform = `scaleY(${p <= 0 ? 0 : outBack(p)})`;
    });
    base.setAttribute("stroke-dashoffset", String(1 - outCubic(span(t, 0.7, 1.05))));
    // 3. the capsule opens and the wordmark slides out from behind the mark
    const open = inOutCubic(span(t, 0.85, 1.6));
    text.style.width = textWidth * open + "px";
    const reveal = outCubic(span(t, 1.05, 1.7));
    inner.style.opacity = String(reveal);
    inner.style.transform = `translateX(${(1 - reveal) * -18}px)`;
    // 4. one pass of light, then it holds
    const sweep = span(t, 1.7, 2.45);
    sheen.style.opacity = String(Math.sin(sweep * Math.PI));
    sheen.style.transform = `translateX(${-240 + sweep * (tag.offsetWidth + 260)}px)`;
    // optional exit
    const leave = withOut ? inOutCubic(span(t, DURATION - OUT, DURATION - 0.04)) : 0;
    const shift = align === "center" ? "translateX(-50%) " : "";
    tag.style.opacity = String(land * (1 - leave));
    tag.style.transform = `${shift}translateY(${(1 - land) * drift + leave * drift}px) scale(${0.86 + 0.14 * land})`;
  }

  window.DURATION = DURATION;
  window.FPS = FPS;
  window.INTRO_END = INTRO_END;
  window.OUT_START = withOut ? DURATION - OUT : null;
  window.SEEK = (t) => {
    draw(t);
    return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => r())));
  };

  document.fonts.ready.then(async () => {
    await Promise.all(["500 34px Inter", "700 34px Inter", "400 28px Inter"].map((f) => document.fonts.load(f)));
    textWidth = Math.ceil(inner.getBoundingClientRect().width);
    draw(0);
    window.READY = true;
    if (!exporting) {
      // in a normal browser tab: fit the stage to the window and loop the intro
      const fit = () => {
        const s = Math.min(innerWidth / 1080, innerHeight / 1920);
        document.documentElement.style.cssText = "width:100vw;height:100vh;background:#111";
        document.body.style.cssText = `transform-origin:0 0;transform:translate(${(innerWidth - 1080 * s) / 2}px,0) scale(${s})`;
      };
      fit();
      addEventListener("resize", fit);
      const start = performance.now();
      const tick = (now) => { draw(((now - start) / 1000) % 6); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
