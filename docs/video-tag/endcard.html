<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Top Provider Picks: 9:16 end card</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
<!--
  The closing frame of a 9:16 commercial: white, the logo rising into place,
  then the web address, then one quiet line about what the site reviews.
  Authored at 1080x1920 CSS px and captured at 2x for 2160x3840.

  Page contract (same as tag.html and the card-maker render pages):
    window.SEEK(t)  window.DURATION  window.FPS  window.READY  window.INTRO_END

  Query params:
    url=...       the address shown            (default www.TopProviderPicks.com)
    tagline=...   the line under it, "|" breaks the line
    dur=6 fps=30  clip length and frame rate
    export=1      no preview loop
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
  body { font-family: "Inter", Arial, sans-serif; color: #17324d; -webkit-font-smoothing: antialiased; }
  .stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* sits a little above centre so it clears the caption and button area on Reels */
    padding-top: 590px;
    text-align: center;
  }
  .mark { width: 172px; }
  .mark svg { width: 100%; height: auto; display: block; overflow: visible; }
  .mark .bar { transform-box: fill-box; transform-origin: 50% 100%; }
  .name {
    margin-top: 44px;
    font-size: 40px;
    line-height: 1;
    font-weight: 500;
    letter-spacing: 6.4px;
    padding-left: 6.4px; /* balances the trailing letter-space so it centres optically */
    white-space: nowrap;
  }
  .name b { font-weight: 700; }
  .rule {
    margin-top: 62px;
    width: 96px;
    height: 3px;
    border-radius: 2px;
    background: #b58c3d;
    transform-origin: 50% 50%;
  }
  .url {
    margin-top: 58px;
    font-family: "Source Serif 4", Georgia, serif;
    font-size: 78px;
    line-height: 1.1;
    font-weight: 400;
    letter-spacing: -1.6px;
    white-space: nowrap;
  }
  .url .www { color: #7c8a93; }
  .url .tld { color: #176b79; }
  .tagline {
    margin-top: 46px;
    font-size: 33px;
    line-height: 1.5;
    font-weight: 400;
    color: #5d6b74;
    letter-spacing: 0.1px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="mark" id="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="2 1 36 41" fill="none" aria-hidden="true">
      <path class="bar" id="bar1" d="M4 33V13l9-5v25z" fill="#17324D" opacity=".5" />
      <path class="bar" id="bar2" d="M15 33V8l9-5v30z" fill="#17324D" />
      <path class="bar" id="bar3" d="M26 33V15l9-5v23z" fill="#176B79" />
      <path id="base" d="m5 39 15-3 15 3" stroke="#17324D" stroke-width="2" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
    </svg>
  </div>
  <div class="name" id="name">TOP <b>PROVIDER PICKS</b></div>
  <div class="rule" id="rule"></div>
  <div class="url" id="url"></div>
  <div class="tagline" id="tagline"></div>
</div>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const exporting = q.get("export") === "1";
  const DURATION = Math.max(3.5, Number(q.get("dur") ?? 6));
  const FPS = Number(q.get("fps") ?? 30);
  const INTRO_END = 3.1;

  const $ = (id) => document.getElementById(id);
  const name = $("name"), rule = $("rule"), url = $("url"), tagline = $("tagline");
  const bars = [$("bar1"), $("bar2"), $("bar3")], base = $("base");

  // split the address so "www." and the ending can sit back a little from the name
  const address = q.get("url") ?? "www.TopProviderPicks.com";
  const m = address.match(/^(www\.)?(.*?)(\.[a-z]+)?$/i);
  const piece = (cls, text) => {
    if (!text) return;
    const s = document.createElement("span");
    if (cls) s.className = cls;
    s.textContent = text;
    url.appendChild(s);
  };
  piece("www", m[1]); piece("", m[2]); piece("tld", m[3]);

  const line = q.get("tagline") ?? "Reviews and rankings of the top companies in|gold IRAs, mortgages, credit cards and banking.";
  line.split("|").forEach((part, i) => {
    if (i) tagline.appendChild(document.createElement("br"));
    tagline.appendChild(document.createTextNode(part.trim()));
  });

  const clamp = (v) => Math.min(1, Math.max(0, v));
  const span = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (p) => 1 - Math.pow(1 - p, 3);
  const outQuart = (p) => 1 - Math.pow(1 - p, 4);
  const outBack = (p) => 1 + 2.2 * Math.pow(p - 1, 3) + 1.2 * Math.pow(p - 1, 2);

  function draw(t) {
    // 1. the logo: three bars rise from the baseline, then the base line draws
    bars.forEach((b, i) => {
      const p = span(t, 0.25 + i * 0.11, 0.8 + i * 0.11);
      b.style.transform = `scaleY(${p <= 0 ? 0 : outBack(p)})`;
    });
    base.setAttribute("stroke-dashoffset", String(1 - outCubic(span(t, 0.75, 1.2))));
    // 2. the wordmark settles in under it
    const n = outQuart(span(t, 0.95, 1.65));
    name.style.opacity = String(n);
    name.style.transform = `translateY(${(1 - n) * 16}px)`;
    name.style.letterSpacing = 6.4 + (1 - n) * 5 + "px";
    // 3. a short gold rule opens from its centre
    const r = outQuart(span(t, 1.45, 2.05));
    rule.style.transform = `scaleX(${r})`;
    rule.style.opacity = String(span(t, 1.45, 1.6));
    // 4. the address, the thing to remember
    const u = outQuart(span(t, 1.7, 2.5));
    url.style.opacity = String(u);
    url.style.transform = `translateY(${(1 - u) * 26}px)`;
    // 5. and one quiet line beneath
    const g = outCubic(span(t, 2.3, 3.0));
    tagline.style.opacity = String(g);
    tagline.style.transform = `translateY(${(1 - g) * 14}px)`;
  }

  window.DURATION = DURATION;
  window.FPS = FPS;
  window.INTRO_END = INTRO_END;
  window.OUT_START = null;
  window.SEEK = (t) => {
    draw(t);
    return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(() => r())));
  };

  document.fonts.ready.then(async () => {
    await Promise.all(
      ["500 40px Inter", "700 40px Inter", "400 33px Inter", '400 78px "Source Serif 4"'].map((f) => document.fonts.load(f)),
    );
    draw(0);
    window.READY = true;
    if (!exporting) {
      const fit = () => {
        const s = Math.min(innerWidth / 1080, innerHeight / 1920);
        document.documentElement.style.cssText = "width:100vw;height:100vh;background:#111";
        document.body.style.cssText = `transform-origin:0 0;transform:translate(${(innerWidth - 1080 * s) / 2}px,0) scale(${s})`;
      };
      fit();
      addEventListener("resize", fit);
      const start = performance.now();
      const tick = (now) => { draw(((now - start) / 1000) % 7); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
  });
})();
</script>
</body>
</html>
